<html lang="en"><head><meta charset="utf-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1a1d29;--m:#667085;--p:#0b6b3a;--r:#c0392b;--b:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--c:#1c1f28;--t:#eceef5;--m:#9aa1b2;--p:#3ecf8e;--r:#ff6b5e;--b:#333847}}
:root[data-theme="dark"]{--bg:#12141a;--c:#1c1f28;--t:#eceef5;--m:#9aa1b2;--p:#3ecf8e;--r:#ff6b5e;--b:#333847}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#v{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:14px 0 6px}.m{color:var(--m);font-size:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.b{display:block;width:100%;padding:13px;margin:8px 0;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:16px;font-weight:600}
.b.o{background:transparent;color:var(--p);border:1.5px solid var(--p)}.b.s{display:inline-block;width:auto;padding:8px 14px;margin:4px 4px 4px 0;font-size:14px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font-size:16px}
.op{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;border:1.5px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font-size:16px}
.op.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,var(--c))}
.g{display:flex;flex-wrap:wrap;gap:4px}.g button{width:34px;height:30px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font-size:12px}.g .d{background:var(--p);color:#fff}.g .cur{outline:2px solid var(--t)}

</style></head><body><div id="v"></div>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOP=['Whole Numbers','Factors & Multiples','Fractions','Decimals & Percentages','Units & Money','Estimation','Binary Numbers','Directed Numbers','Basic Algebra','Simple Equations','Solids & Shapes','Perimeter & Area','Angles','Averages'];
const MAXQ=50,DUR=5400000,MAIL='myschoolquiz26@gmail.com';
/* ---- 500 fixed questions: question N is always identical on every phone (seeded), so the teacher can mark any shuffle ---- */
const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gcd=(a,b)=>b?gcd(b,a%b):a;
function Q(id){const r=R(id*7919+13),i=(a,b)=>a+Math.floor(r()*(b-a+1)),T=(id-1)%14,pk=A=>A[i(0,A.length-1)];let q,a,d;const n=(v,x)=>{a=v;d=x};
switch(T){
case 0:{let x=i(1200,9800),y=i(300,999),c=i(0,2);if(c==0){q=`Calculate ${x} + ${y}.`;n(x+y,[x+y+10,x+y-100,x+y+100])}else if(c==1){q=`Evaluate ${x} - ${y}.`;n(x-y,[x-y+10,x-y-100,x-y+100])}else{let u=i(12,48),v=i(12,48);q=`Multiply ${u} by ${v}.`;n(u*v,[u*v+10,u*v-u,u*v+v])}break}
case 1:{if(r()<.5){let x=i(2,12),y=i(2,12),g=gcd(x,y),l=x*y/g;q=`Find the LCM of ${x} and ${y}.`;n(l,[x*y*2,l+g,l-1,g])}else{let g=i(2,6),x=g*i(2,5),y=g*i(2,6),h=gcd(x,y);q=`Find the HCF of ${x} and ${y}.`;n(h,[h*2,h+1,x*y/h,1])}break}
case 2:{if(r()<.5){let p=i(1,5),s=p+i(1,4);while(gcd(p,s)>1){p=i(1,5);s=p+i(1,4)}let k=i(2,5);q=`Simplify ${p*k}/${s*k} to its lowest terms.`;n(`${p}/${s}`,[`${p}/${s+1}`,`${p+1}/${s}`,`${s}/${p}`])}else{let w=i(1,5),dd=i(3,9),rr=i(1,dd-1);q=`Express ${w*dd+rr}/${dd} as a mixed number.`;n(`${w} ${rr}/${dd}`,[`${w+1} ${rr}/${dd}`,`${w} ${dd}/${rr}`,`${w} ${rr+1}/${dd}`])}break}
case 3:{if(r()<.5){let p=pk([10,20,25,50,5,30]),N=i(2,20)*20,v=p*N/100;q=`Find ${p}% of ${N}.`;n(v,[v+p,v*2,N-v,v+10])}else{const P=[[1,2,'0.5'],[1,4,'0.25'],[3,4,'0.75'],[1,5,'0.2'],[3,5,'0.6'],[1,8,'0.125'],[2,5,'0.4'],[7,10,'0.7']],z=pk(P);q=`Express ${z[0]}/${z[1]} as a decimal.`;n(z[2],P.filter(u=>u!==z).map(u=>u[2]))}break}
case 4:{let x=i(2,40),c=i(0,3);if(c==0){q=`Convert ${x} km to metres.`;n(x*1000,[x*100,x*10,x*10000])}else if(c==1){q=`How many minutes are in ${x} hours?`;n(x*60,[x*100,x*24,x*30])}else if(c==2){q=`How many kobo are in N${x}?`;n(x*100,[x*10,x*1000,x*50])}else{q=`Convert ${x*100} cm to metres.`;n(x,[x*10,x/10,x*100])}break}
case 5:{let x=i(1234,9876);if(r()<.5){let f=Math.floor(x/100)*100;q=`Round ${x} to the nearest hundred.`;n(Math.round(x/100)*100,[f,f+100,Math.round(x/10)*10,f-100])}else{let f=Math.floor(x/10)*10;q=`Round ${x} to the nearest ten.`;n(Math.round(x/10)*10,[f,f+10,Math.round(x/100)*100,f-10])}break}
case 6:{let m=i(5,31),b=m.toString(2);if(r()<.5){q=`Convert ${b} (base two) to a number in base ten.`;n(m,[m+1,m-1,m+2,m-2])}else{q=`Express ${m} in base two.`;n(b,[(m+1).toString(2),(m-1).toString(2),(m+2).toString(2),(m+4).toString(2)])}break}
case 7:{let x=i(-12,12),y=i(-12,12),c=i(0,2);if(c==0){q=`Evaluate ${x} - (${y}).`;n(x-y,[x+y,y-x,-(x+y),x-y+2])}else if(c==1){q=`Evaluate ${x} + (${y}).`;n(x+y,[x-y,y-x,-(x+y),x+y+2])}else{q=`Evaluate (${x}) x (${y}).`;n(x*y,[-x*y,x+y,x*y+x,x*y+2])}break}
case 8:{if(r()<.5){let p=i(2,9),q2=i(2,9),s=i(1,p),c=p+q2-s;q=`Simplify ${p}a + ${q2}a - ${s}a.`;n(`${c}a`,[`${p+q2+s}a`,`${p-q2+s}a`,`${c}a²`,`${c+1}a`])}else{let m=i(2,9),k=i(2,9),c=i(1,9);q=`If a = ${k}, evaluate ${m}a + ${c}.`;n(m*k+c,[m+k+c,m*(k+c),m*k-c,m*k+c+m])}break}
case 9:{if(r()<.5){let x=i(2,12),m=i(2,6),b=i(1,15),c=m*x+b;q=`Solve ${m}x + ${b} = ${c}.`;n(`x = ${x}`,[`x = ${x+1}`,`x = ${x-1}`,`x = ${x+2}`,`x = ${c-b}`])}else{let x=i(3,20),b=i(2,9),t=x+b;q=`Solve x - ${b} = ${x}.`;n(`x = ${t}`,[`x = ${x-b}`,`x = ${t+2}`,`x = ${b}`,`x = ${t-1}`])}break}
case 10:{const N=['','','','triangular','quadrilateral','pentagonal','hexagonal','heptagonal','octagonal'],F=[["How many edges has a cuboid?",12,[8,6,10]],["How many vertices has a cube?",8,[6,12,4]],["How many sides has a hexagon?",6,[5,7,8]],["How many lines of symmetry has a square?",4,[2,1,8]],["How many lines of symmetry has an equilateral triangle?",3,[1,2,6]],["How many faces has a square-based pyramid?",5,[4,6,8]],["How many faces has a cylinder?",3,[2,1,4]],["How many sides has an octagon?",8,[6,7,10]]],c=i(0,3),k=i(3,8);if(c==0){let f=pk(F);q=f[0];n(f[1],f[2])}else if(c==1){q=`How many faces has a prism whose base is a polygon with ${k} sides?`;n(k+2,[k+1,k+3,2*k])}else if(c==2){q=`How many edges has a prism whose base is a polygon with ${k} sides?`;n(3*k,[2*k,k+2,3*k-3,4*k])}else{q=`How many vertices has a prism whose base is a polygon with ${k} sides?`;n(2*k,[k+2,3*k,k,2*k+2])}break}
case 11:{let c=i(0,3),l=i(8,30),w=i(3,l-1),u=(v,t)=>`${v} ${t}`;if(c==0){q=`A rectangle is ${l} cm long and ${w} cm wide. Find its perimeter.`;n(u(2*(l+w),'cm'),[u(l*w,'cm'),u(l+w,'cm'),u(2*l*w,'cm'),u(2*(l+w)+2,'cm')])}else if(c==1){q=`Find the area of a rectangle ${l} cm by ${w} cm.`;n(u(l*w,'cm²'),[u(2*(l+w),'cm²'),u(l+w,'cm²'),u(2*l*w,'cm²'),u(l*w+l,'cm²')])}else if(c==2){let b=2*i(3,15),h=i(3,20);q=`Find the area of a triangle with base ${b} cm and height ${h} cm.`;n(u(b*h/2,'cm²'),[u(b*h,'cm²'),u(b+h,'cm²'),u(b*h/4,'cm²'),u(b*h/2+b,'cm²')])}else{let k=7*i(1,5);q=`Find the circumference of a circle of radius ${k} cm. [Take pi = 22/7]`;n(u(44*k/7,'cm'),[u(22*k/7,'cm'),u(88*k/7,'cm'),u(k*k*22/7,'cm'),u(44*k/7+k,'cm')])}break}
case 12:{let x=i(20,80),z=i(30,70),c=i(0,3),D=v=>v+'°';if(c==0){q=`Two angles on a straight line are ${x}° and y°. Find y.`;n(D(180-x),[D(360-x),D(90-x),D(180+x),D(x)])}else if(c==1){q=`Two angles of a triangle are ${x}° and ${z}°. Find the third angle.`;n(D(180-x-z),[D(360-x-z),D(x+z),D(180-x),D(90-x)])}else if(c==2){q=`Find the complement of ${x}°.`;n(D(90-x),[D(180-x),D(x),D(360-x),D(90+x)])}else{q=`Three angles at a point are ${x}°, ${z}° and w°. Find w.`;n(D(360-x-z),[D(180-x-z),D(x+z),D(360-x),D(360+x-z)])}break}
default:{let c=i(0,2),A=[...Array(5)].map(()=>i(2,15));if(c==0){let s=A.reduce((p,v)=>p+v,0);A[4]+=(5-s%5)%5;let m=A.reduce((p,v)=>p+v,0)/5;q=`Find the mean of ${A.join(', ')}.`;n(m,[m+1,m-1,m+2,Math.max(...A)])}else if(c==1){let s=[...A].sort((p,v)=>p-v);q=`Find the median of ${A.join(', ')}.`;n(s[2],[s[1],s[3],s[0],s[4]])}else{let m=i(2,9),x=[i(10,12),i(13,15),i(16,18),i(19,21)],B=[m,m,m,...x].sort(()=>r()-.5);q=`Find the mode of ${B.join(', ')}.`;n(m,[x[0],x[1],m+1,x[2]])}}}
const o=[String(a)];for(const z of d.map(String))if(!o.includes(z)&&o.length<4)o.push(z);
for(let k=1;o.length<4&&k<30;k++){const z=isNaN(+a)?a+k:String(+a+(k%2?k:-k));if(!o.includes(z))o.push(z)}
return{id,t:TOP[T],q,a:String(a),o}}
/* ---- helpers ---- */
const V=$('#v');let tm=null,U=L('mq_u',{}),user=null,SS=L('mq_s',null);
const go=h=>{clearInterval(tm);V.innerHTML=h;scrollTo(0,0)};
const hp=p=>btoa(encodeURIComponent(p)),shuf=A=>A.slice().sort(()=>Math.random()-.5);
const msg=t=>{const e=$('#msg');if(e)e.textContent=t};
const grade=p=>p>=70?'Distinction':p>=55?'Credit':p>=40?'Pass':'Fail';
const col=p=>p>=70?'var(--p)':p>=50?'#d99a00':'var(--r)';
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dec=c=>JSON.parse(decodeURIComponent(escape(atob(c))));
function home(){go(`<h1>🎓 JSS 1 Mathematics Quiz</h1><p class="m">Nigerian curriculum · NECO/BECE standard</p><button class="b" onclick="sAuth()">I am a Student</button><button class="b o" onclick="tLogin()">I am a Teacher</button><p class="m">To install: open your browser menu and tap “Add to Home Screen”.</p>`)}
/* ---- student ---- */
function sAuth(up){go(`<h1>${up?'Student Sign Up':'Student Login'}</h1><div class="card">${up?`<input id="n" placeholder="Full name"><input id="c" placeholder="Class (e.g. JSS 1A)"><input id="p" type="tel" placeholder="Phone number"><input id="e" type="email" placeholder="Email address">`:''}<input id="u" placeholder="Username" autocapitalize="none"><input id="w" type="password" placeholder="Password"><p id="msg" class="no"></p><button class="b" onclick="${up?'signup()':'login()'}">${up?'Create account':'Login'}</button><button class="b o" onclick="sAuth(${!up})">${up?'I have an account':'New student? Sign up'}</button></div><button class="b o" onclick="home()">Back</button>`)}
function signup(){const g=i=>$('#'+i).value.trim(),u={n:g('n'),c:g('c'),p:g('p'),e:g('e'),u:g('u').toLowerCase(),w:g('w')};if(Object.values(u).some(x=>!x))return msg('Please fill every field.');if(!/^\S+@\S+\.\S+$/.test(u.e))return msg('Enter a valid email.');if(U[u.u])return msg('Username already taken.');u.w=hp(u.w);U[u.u]=u;S('mq_u',U);user=u;dash()}
function login(){const u=U[$('#u').value.trim().toLowerCase()];if(!u||u.w!==hp($('#w').value))return msg('Wrong username or password.');user=u;dash()}
function dash(){const n=L('mq_r',[]).filter(r=>r.u===user.u).length,mine=SS&&SS.u===user.u;go(`<h1>Hello, ${esc(user.n)}</h1><p class="m">${esc(user.c)} · ${n} attempt(s) on this phone</p><div class="card"><b>Rules</b><br>${MAXQ} random questions · 1 hour 30 minutes · auto-submits when time is up.</div><button class="b" onclick="${mine?'quiz()':'start()'}">${mine?'Resume quiz':'Start quiz'}</button><button class="b o" onclick="user=null;home()">Logout</button>`)}
function start(){if(SS&&SS.u!==user.u)SS=null;const ids=shuf([...Array(500).keys()].map(x=>x+1)).slice(0,MAXQ),ord={};ids.forEach(id=>ord[id]=shuf(Q(id).o));SS={u:user.u,s:Date.now(),ids,ord,a:{},i:0};S('mq_s',SS);quiz()}
function quiz(){clearInterval(tm);if(Date.now()>=SS.s+DUR)return finish(true);tm=setInterval(tick,1000);rq();tick()}
function tick(){const l=SS.s+DUR-Date.now();if(l<=0)return finish(true);const e=$('#tm');if(e){e.textContent=String(Math.floor(l/60000)).padStart(2,'0')+':'+String(Math.floor(l/1000)%60).padStart(2,'0');e.style.color=l<300000?'var(--r)':''}}
function rq(){const id=SS.ids[SS.i],q=Q(id),done=Object.keys(SS.a).length;V.innerHTML=`<div class="top row"><b>Q ${SS.i+1}/${MAXQ}</b><b id="tm"></b><span class="m">${done} answered</span></div><div class="card"><p><b>${esc(q.q)}</b></p>${SS.ord[id].map((o,k)=>`<button class="op ${SS.a[id]===o?'sel':''}" onclick="pick(${k})">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}</div><div class="row"><button class="b s o" ${SS.i?'':'disabled'} onclick="jump(${SS.i-1})">Prev</button><button class="b s o" ${SS.i<MAXQ-1?'':'disabled'} onclick="jump(${SS.i+1})">Next</button><button class="b s" onclick="sub1()">Submit</button></div><div class="g">${SS.ids.map((x,k)=>`<button class="${SS.a[x]!==undefined?'d':''} ${k==SS.i?'cur':''}" onclick="jump(${k})">${k+1}</button>`).join('')}</div>`;tick()}
function pick(k){const id=SS.ids[SS.i];SS.a[id]=SS.ord[id][k];S('mq_s',SS);rq()}
function jump(k){SS.i=k;S('mq_s',SS);rq()}
function sub1(){V.insertAdjacentHTML('beforeend',`<div class="card" id="cf"><b>Submit now?</b><p>${MAXQ-Object.keys(SS.a).length} question(s) unanswered.</p><button class="b" onclick="finish(false)">Yes, submit</button><button class="b o" onclick="$('#cf').remove()">Go back</button></div>`);$('#cf').scrollIntoView()}
function finish(auto){clearInterval(tm);const rec={n:user?user.n:(U[SS.u]||{}).n,c:(U[SS.u]||{}).c,p:(U[SS.u]||{}).p,e:(U[SS.u]||{}).e,u:SS.u,t:Date.now(),x:auto?1:0,a:SS.ids.map(id=>[id,SS.a[id]||''])},all=L('mq_r',[]);all.push(rec);S('mq_r',all);SS=null;try{localStorage.removeItem('mq_s')}catch(e){}
const code=enc(rec),link=`mailto:${MAIL}?subject=${encodeURIComponent('Maths Quiz - '+rec.n+' ('+rec.c+')')}&body=${encodeURIComponent(code)}`;
go(`<h1>${auto?'⏰ Time is up':'✅ Submitted'}</h1><p>${auto?'Your answers were submitted automatically.':'Your answers have been saved.'} Now send them to your teacher:</p><a class="b" style="text-align:center;text-decoration:none" href="${link}">Email result to teacher</a><p class="m">If your email app did not open, copy this code and send it to ${MAIL}:</p><textarea id="cd" rows="5" readonly onclick="this.select()">${code}</textarea><button class="b o" onclick="$('#cd').select();try{navigator.clipboard.writeText($('#cd').value)}catch(e){}">Copy code</button><button class="b o" onclick="home()">Done</button>`);if(auto)try{location.href=link}catch(e){}}
/* ---- teacher ---- */
function tLogin(){go(`<h1>Teacher Login</h1><div class="card"><input id="pin" type="password" inputmode="numeric" placeholder="Teacher PIN"><p id="msg" class="no"></p><button class="b" onclick="L('mq_p','2026')==$('#pin').value?tHome():msg('Wrong PIN')">Login</button></div><button class="b o" onclick="home()">Back</button>`)}
const mk=r=>{let s=0,T={};const rv=r.a.map(([id,x])=>{const q=Q(id),ok=x===q.a;s+=ok;T[q.t]=T[q.t]||[0,0];T[q.t][1]++;T[q.t][0]+=ok;return{q,x,ok}});return{s,T,rv,n:r.a.length,pct:Math.round(s/r.a.length*100)}};
const bars=T=>Object.entries(T).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[c,n]])=>{const p=Math.round(c/n*100);return`<div class="row m"><span>${esc(k)}</span><span>${c}/${n} · ${p}%</span></div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>`}).join('');
const sw=T=>{const e=Object.entries(T).map(([k,[c,n]])=>[k,c/n]);return{st:e.filter(x=>x[1]>=.7).map(x=>x[0]),wk:e.filter(x=>x[1]<.5).map(x=>x[0])}};
function agg(M){const T={};M.forEach(m=>Object.entries(m.T).forEach(([k,[c,n]])=>{T[k]=T[k]||[0,0];T[k][0]+=c;T[k][1]+=n}));return T}
function tHome(){const rs=L('mq_r',[]).map((r,i)=>({r,i,m:mk(r)})).sort((a,b)=>b.m.pct-a.m.pct),T=agg(rs.map(x=>x.m)),s=sw(T),avg=rs.length?Math.round(rs.reduce((p,x)=>p+x.m.pct,0)/rs.length):0;
go(`<h1>Teacher Dashboard</h1><div class="card"><div class="row"><b>${rs.length} result(s)</b><b>Class average: ${avg}%</b></div>${rs.length?`<h2>Class strengths &amp; weaknesses</h2>${bars(T)}<p class="ok">Strong: ${s.st.map(esc).join(', ')||'none yet'}</p><p class="no">Weak: ${s.wk.map(esc).join(', ')||'none'}</p>`:'<p class="m">No results yet. Import student codes below.</p>'}</div>
${rs.length?`<button class="b" onclick="classPdf()">Download class report (PDF)</button>`:''}
${rs.map((x,k)=>`<div class="card" onclick="tDet(${x.i})"><div class="row"><b>${k+1}. ${esc(x.r.n)}</b><b style="color:${col(x.m.pct)}">${x.m.s}/${x.m.n} · ${x.m.pct}%</b></div><span class="m">${esc(x.r.c)} · ${grade(x.m.pct)}${x.r.x?' · auto-submitted':''}</span></div>`).join('')}
<h2>Import student codes</h2><textarea id="imp" rows="4" placeholder="Paste codes from emails, one per line"></textarea><p id="msg" class="m"></p><button class="b o" onclick="imp()">Import</button>
<h2>Settings</h2><input id="np" inputmode="numeric" placeholder="New PIN"><button class="b o" onclick="if($('#np').value.length>=4){S('mq_p',$('#np').value);msg('PIN changed')}else msg('Use at least 4 digits')">Change PIN</button><button class="b o" onclick="home()">Logout</button>`)}
function imp(){const all=L('mq_r',[]);let k=0,bad=0;$('#imp').value.split(/\s+/).filter(Boolean).forEach(c=>{try{const r=dec(c);if(!r.a||!r.u)throw 0;if(!all.some(x=>x.t===r.t&&x.u===r.u)){all.push(r);k++}}catch(e){bad++}});S('mq_r',all);tHome();msg(`${k} imported, ${bad} invalid`)}
function tDet(i){const r=L('mq_r',[])[i],m=mk(r),s=sw(m.T);go(`<button class="b s o" onclick="tHome()">← Back</button><h1>${esc(r.n)}</h1><p class="m">${esc(r.c)} · ${esc(r.p)} · ${esc(r.e)}<br>Username: ${esc(r.u)}</p><div class="card"><div class="row"><b style="font-size:24px">${m.s}/${m.n}</b><b>${m.pct}% · ${grade(m.pct)}</b></div></div><h2>Topic performance</h2>${bars(m.T)}<p class="ok">Strengths: ${s.st.map(esc).join(', ')||'none yet'}</p><p class="no">Weaknesses: ${s.wk.map(esc).join(', ')||'none'}</p><button class="b" onclick="stuPdf(${i})">Download PDF report</button><h2>Marked answers</h2>${m.rv.map((v,k)=>`<div class="card"><span class="m">${k+1}. ${esc(v.q.t)}</span><br>${esc(v.q.q)}<br><span class="${v.ok?'ok':'no'}">${v.ok?'✓':'✗'} ${esc(v.x||'(no answer)')}</span>${v.ok?'':`<br><span class="ok">Correct: ${esc(v.q.a)}</span>`}</div>`).join('')}`)}
/* ---- PDF ---- */
const cl=s=>String(s).replace(/[^\x00-\xFF]/g,'-').replace(/\u2212/g,'-');
async function pdf(title,lines,fn){if(!window.jspdf)return alert('PDF library not loaded. Check your connection.');const d=new jspdf.jsPDF();let y=15;d.setFontSize(14);d.text(cl(title),15,y);y+=10;d.setFontSize(10);for(const l of lines)for(const t of d.splitTextToSize(cl(l),180)){if(y>282){d.addPage();y=15}d.text(t,15,y);y+=5.5}
if(window.claude){try{const dl=await claude.use('downloads');if(dl)await dl.save({filename:fn,data:d.output('blob')});else d.save(fn)}catch(e){}}else d.save(fn)}
const tl=T=>Object.entries(T).map(([k,[c,n]])=>`${k}: ${c}/${n} (${Math.round(c/n*100)}%)`);
function stuPdf(i){const r=L('mq_r',[])[i],m=mk(r),s=sw(m.T);pdf('JSS 1 Mathematics Quiz - Student Report',[`Name: ${r.n}`,`Class: ${r.c}   Phone: ${r.p}   Email: ${r.e}`,`Date: ${new Date(r.t).toLocaleString()}`,`Score: ${m.s}/${m.n} (${m.pct}%) - ${grade(m.pct)}`,'','TOPIC PERFORMANCE',...tl(m.T),'',`Strengths: ${s.st.join(', ')||'none yet'}`,`Weaknesses: ${s.wk.join(', ')||'none'}`,'','CORRECTIONS',...m.rv.map((v,k)=>[v,k]).filter(([v])=>!v.ok).map(([v,k])=>`${k+1}. ${v.q.q} | Chosen: ${v.x||'none'} | Correct: ${v.q.a}`)],`${r.n.replace(/\W+/g,'_')}_report.pdf`)}
function classPdf(){const rs=L('mq_r',[]).map(r=>({r,m:mk(r)})).sort((a,b)=>b.m.pct-a.m.pct),T=agg(rs.map(x=>x.m)),s=sw(T);pdf('JSS 1 Mathematics Quiz - Class Report',[`Students: ${rs.length}   Class average: ${Math.round(rs.reduce((p,x)=>p+x.m.pct,0)/rs.length)}%`,'','RANKING',...rs.map((x,k)=>`${k+1}. ${x.r.n} (${x.r.c}) - ${x.m.s}/${x.m.n} ${x.m.pct}% ${grade(x.m.pct)}`),'','TOPIC AVERAGES',...tl(T),'',`Class strengths: ${s.st.join(', ')||'none yet'}`,`Class weaknesses: ${s.wk.join(', ')||'none'}`],'class_report.pdf')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script></body></html>
